name: QA

# テスト（npm test）を回す（Claude は使わない）。中身は共通部品 satou-aaaaa/shared-workflows の node-test.yml。
# 検査の名前は「qa / qa」（main のルールセットの必須チェック。ジョブ名 qa を変えない）。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qa:
    uses: satou-aaaaa/shared-workflows/.github/workflows/node-test.yml@main
